name: Generate Event Posters

on:
  workflow_dispatch: # Just click a button to run it

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Generate banners and create API
        run: node POSTA/build-posters.js

      - name: Save files to GitHub
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posters/ api/events.json
          git commit -m "Generated custom banners for schedule" || echo "No changes"
          git push
