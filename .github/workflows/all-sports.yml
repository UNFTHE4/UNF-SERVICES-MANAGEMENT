name: All Sports Upcoming Schedule

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

permissions:
  contents: write

concurrency:
  group: all-sports-feed
  cancel-in-progress: true

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Fetch Upcoming Games
        run: |
          node --input-type=commonjs - <<'JS'
          const fs = require('fs');
          const BASE = 'https://site.api.espn.com/apis/site/v2/sports';

          const LEAGUES = [
            ['football', 'nfl'],
            ['football', 'college-football'],
            ['basketball', 'nba'],
            ['basketball', 'wnba'],
            ['basketball', 'mens-college-basketball'],
            ['basketball', 'womens-college-basketball'],
            ['baseball', 'mlb'],
            ['baseball', 'college-baseball'],
            ['hockey', 'nhl'],
            ['hockey', 'mens-college-hockey'],
            ['mma', 'ufc'],
            ['golf', 'pga'],
            ['golf', 'lpga'],
            ['tennis', 'atp'],
            ['tennis', 'wta'],
            ['racing', 'f1'],
            ['racing', 'nascar-premier'],
            ['racing', 'irl'],
            ['boxing', 'all'],
            ['lacrosse', 'pll'],
            ['rugby', 'super-rugby'],
            ['cricket', '8039'],
            ['volleyball', 'usa.1'],
            ['water-polo', 'usa.1'],
            ['soccer', 'eng.1'], ['soccer', 'esp.1'], ['soccer', 'ita.1'], ['soccer', 'ger.1'], ['soccer', 'fra.1'],
            ['soccer', 'ned.1'], ['soccer', 'por.1'], ['soccer', 'bel.1'], ['soccer', 'tur.1'], ['soccer', 'gre.1'],
            ['soccer', 'sco.1'], ['soccer', 'rus.1'], ['soccer', 'ukr.1'], ['soccer', 'aut.1'], ['soccer', 'sui.1'],
            ['soccer', 'den.1'], ['soccer', 'swe.1'], ['soccer', 'nor.1'], ['soccer', 'fin.1'], ['soccer', 'pol.1'],
            ['soccer', 'cze.1'], ['soccer', 'cro.1'], ['soccer', 'srb.1'], ['soccer', 'rom.1'], ['soccer', 'hun.1'],
            ['soccer', 'bul.1'], ['soccer', 'isr.1'], ['soccer', 'cyp.1'], ['soccer', 'irl.1'], ['soccer', 'wal.1'],
            ['soccer', 'eng.2'], ['soccer', 'esp.2'], ['soccer', 'ita.2'], ['soccer', 'ger.2'], ['soccer', 'fra.2'],
            ['soccer', 'usa.1'], ['soccer', 'usa.nwsl'], ['soccer', 'mex.1'], ['soccer', 'bra.1'], ['soccer', 'arg.1'],
            ['soccer', 'chi.1'], ['soccer', 'col.1'], ['soccer', 'per.1'], ['soccer', 'uru.1'], ['soccer', 'ecu.1'],
            ['soccer', 'par.1'], ['soccer', 'ven.1'], ['soccer', 'bol.1'], ['soccer', 'crc.1'], ['soccer', 'hon.1'],
            ['soccer', 'gua.1'], ['soccer', 'slv.1'], ['soccer', 'pan.1'],
            ['soccer', 'jpn.1'], ['soccer', 'kor.1'], ['soccer', 'chn.1'], ['soccer', 'aus.1'], ['soccer', 'ind.1'],
            ['soccer', 'ksa.1'], ['soccer', 'uae.1'], ['soccer', 'qat.1'], ['soccer', 'irn.1'], ['soccer', 'tha.1'],
            ['soccer', 'rsa.1'], ['soccer', 'egy.1'], ['soccer', 'mar.1'], ['soccer', 'nga.1'], ['soccer', 'tun.1'],
            ['soccer', 'alg.1'],
            ['soccer', 'uefa.champions'], ['soccer', 'uefa.europa'], ['soccer', 'uefa.europa.conf'], ['soccer', 'uefa.super_cup'],
            ['soccer', 'conmebol.libertadores'], ['soccer', 'conmebol.sudamericana'],
            ['soccer', 'concacaf.champions'], ['soccer', 'concacaf.leagues.cup'],
            ['soccer', 'afc.champions'], ['soccer', 'caf.champions']
          ];

          async function getUpcoming(sport, league) {
            let allEvents = [];
            const today = new Date();

            for (let i = 0; i < 7; i++) {
              const d = new Date(today);
              d.setDate(d.getDate() + i);
              const dateStr = d.toISOString().split('T')[0].replace(/-/g, '');

              const url = `${BASE}/${sport}/${league}/scoreboard?dates=${dateStr}`;

              try {
                const res = await fetch(url);
                if (!res.ok) continue;
                const data = await res.json();
                const events = data.events || [];
                const now = new Date();

                for (const ev of events) {
                  if (ev.status.type.state === 'post' || ev.status.type.state === 'in') continue;
                  if (new Date(ev.date) <= now) continue;

                  const comp = ev.competitions?.[0] || {};
                  const home = comp.competitors?.find(c => c.homeAway === 'home');
                  const away = comp.competitors?.find(c => c.homeAway === 'away');

                  allEvents.push({
                    sport,
                    league: data.leagues?.[0]?.name || league,
                    league_logo: data.leagues?.[0]?.logos?.[0]?.href || null,
                    start_time_utc: ev.date,
                    name: ev.name,
                    short_name: ev.shortName,
                    venue: comp.venue?.fullName || null,
                    home_team: home?.team?.displayName || null,
                    home_logo: home?.team?.logo || null,
                    away_team: away?.team?.displayName || null,
                    away_logo: away?.team?.logo || null,
                  });
                }
              } catch (e) {
              }
            }
            return allEvents;
          }

          (async () => {
            let allUpcoming = [];

            for (let i = 0; i < LEAGUES.length; i += 5) {
              const chunk = LEAGUES.slice(i, i + 5);
              const results = await Promise.all(chunk.map(([sport, league]) => getUpcoming(sport, league)));

              results.forEach((events, index) => {
                const [sport, league] = chunk[index];
                if (events.length > 0) {
                  console.log(`✅ ${sport}/${league}: ${events.length} upcoming`);
                  allUpcoming.push(...events);
                }
              });
            }

            const uniqueEvents = Array.from(new Map(allUpcoming.map(item => [item.name + item.start_time_utc, item])).values());

            uniqueEvents.sort((a, b) => new Date(a.start_time_utc) - new Date(b.start_time_utc));

            fs.mkdirSync('api', { recursive: true });
            fs.writeFileSync('api/schedule.json', JSON.stringify({
              generated_at: new Date().toISOString(),
              total_upcoming: uniqueEvents.length,
              events: uniqueEvents
            }, null, 2));

            console.log(`🎉 Saved ${uniqueEvents.length} upcoming events.`);
          })();
          JS

      - name: Merge SofaScore schedule
        run: |
          node --input-type=commonjs - <<'JS'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('api/schedule.json','utf8'));
          const MONIRUL_URL = 'https://raw.githubusercontent.com/sm-monirulislam/Upcoming-and-Live-Sports-Data/refs/heads/main/Sports_data.json';

          function parseTime(s) {
            if (!s) return null;
            const clean = String(s).replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();
            const m = clean.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)$/i);
            if (m) {
              let [,dd,mm,yyyy,hh,min,ss,ap] = m;
              hh = parseInt(hh,10); ap = ap.toUpperCase();
              if (ap==='PM' && hh!==12) hh+=12;
              if (ap==='AM' && hh===12) hh=0;
              return Date.UTC(+yyyy,+mm-1,+dd,hh-6,+min,+(ss||0));
            }
            const t = Date.parse(clean);
            return isNaN(t) ? null : t;
          }

          (async () => {
            let r;
            try { r = await fetch(MONIRUL_URL); } catch { return; }
            if (!r.ok) return;
            const md = await r.json();

            const seen = new Set((data.events||[]).map(e => e.name+'|'+e.start_time_utc));
            let added = 0;

            for (const m of (md.matches || [])) {
              const info = m.eventInfo || {};
              if (String(m.status||'').toUpperCase() === 'ENDED') continue;
              const start = parseTime(info.startTime);
              if (!start) continue;

              const title = m.event_name || ((info.teamA||'')+' vs '+(info.teamB||''));
              const startIso = new Date(start).toISOString();
              const key = title+'|'+startIso;
              if (seen.has(key)) continue;
              seen.add(key);

              const cat = String(m.Category||'').toLowerCase();
              const sport = cat.includes('basket') ? 'basketball'
                : cat.includes('cricket') ? 'cricket'
                : cat.includes('hockey') ? 'hockey'
                : cat.includes('tennis') ? 'tennis'
                : cat.includes('motor') || cat.includes('racing') ? 'motorsport'
                : cat.includes('mma') || cat.includes('box') ? 'mma'
                : 'football';

              data.events.push({
                sport,
                league: info.eventName || m.Category || 'Other',
                league_logo: info.event_logo ? info.event_logo.replace(/^http:\/\//,'https://') : null,
                start_time_utc: startIso,
                name: title,
                short_name: '',
                venue: '',
                home_team: info.teamA || null,
                home_logo: info.teamAFlag || null,
                away_team: info.teamB || null,
                away_logo: info.teamBFlag || null
              });
              added++;
            }

            data.events.sort((a,b) => new Date(a.start_time_utc) - new Date(b.start_time_utc));
            data.total_upcoming = data.events.length;
            fs.writeFileSync('api/schedule.json', JSON.stringify(data, null, 2));
            console.log(`Added ${added} SofaScore events`);
          })();
          JS

      - name: Connect Official Logos from all-sports.xml
        run: |
          node --input-type=commonjs - <<'JS'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('api/schedule.json','utf8'));
          const XML_URL = 'https://raw.githubusercontent.com/UNFTHE4/UNF-SERVICES-MANAGEMENT/refs/heads/main/api/all-sports.xml';

          // Same normalize function used in your other scripts
          function normalize(s) {
            return String(s || '')
              .toLowerCase()
              .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
              .replace(/\b(fc|afc|cf|sc|cd|ca|ac|as|us|sv|vfb|vfl|fsv|tsg|sd|ud|rcd|rc|club|deportivo|stade|de|of|the|united|city|town)\b/g, ' ')
              .replace(/\b(u[\s-]?\d{1,2}|under[\s-]?\d{1,2}|women|womens|men|mens|emerging|academy|reserves?)\b/g, ' ')
              .replace(/\s+a(?:\s+|$)/g, ' ')
              .replace(/[^a-z0-9]/g, '');
          }

          (async () => {
            let xml = '';
            try {
              const r = await fetch(XML_URL);
              if (r.ok) xml = await r.text();
            } catch (e) { console.warn("Failed to load XML: " + e.message); }
            if (!xml) return;

            // Parse the XML into a dictionary
            const teamMap = {};
            const re = /<team\s+[^>]*><name>([^<]+)<\/name><logo>([^<]+)<\/logo><\/team>/g;
            let m;
            while ((m = re.exec(xml)) !== null) {
              const name = m[1].replace(/&amp;/g, '&').replace(/&apos;/g, "'");
              const logo = m[2].trim();
              if (logo) teamMap[normalize(name)] = logo;
            }

            let updated = 0;
            for (const e of (data.events || [])) {
              if (e.home_team) {
                const hKey = normalize(e.home_team);
                if (teamMap[hKey]) { e.home_logo = teamMap[hKey]; updated++; }
              }
              if (e.away_team) {
                const aKey = normalize(e.away_team);
                if (teamMap[aKey]) { e.away_logo = teamMap[aKey]; updated++; }
              }
            }

            fs.writeFileSync('api/schedule.json', JSON.stringify(data, null, 2));
            console.log(`✅ Synced official team logos: ${updated} updates.`);
          })();
          JS

      - name: Generate league cover images
        run: |
          node --input-type=commonjs - <<'JS'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('api/schedule.json','utf8'));
          const SOLO_SPORTS = new Set(['racing','mma','boxing','golf','tennis','cricket','rugby','lacrosse']);
          const REPO = 'https://rawcdn.githack.com/UNFTHE4/UNF-SERVICES-MANAGEMENT/main';
          const MONIRUL_URL = 'https://raw.githubusercontent.com/sm-monirulislam/Upcoming-and-Live-Sports-Data/refs/heads/main/Sports_data.json';

          const randColor = () => {
            const h = Math.random()*360, s = (60 + Math.random()*30)/100, l = (25 + Math.random()*20)/100;
            const c = (1 - Math.abs(2*l - 1)) * s;
            const x = c * (1 - Math.abs((h/60) % 2 - 1));
            const m = l - c/2;
            let r=0,g=0,b=0;
            if (h<60){r=c;g=x;} else if (h<120){r=x;g=c;} else if (h<180){g=c;b=x;}
            else if (h<240){g=x;b=c;} else if (h<300){r=x;b=c;} else {r=c;b=x;}
            const to = v => Math.round((v+m)*255);
            return `rgb(${to(r)},${to(g)},${to(b)})`;
          };
          const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

          async function toDataUri(url) {
            try {
              const r = await fetch(url);
              if (!r.ok) return null;
              const buf = Buffer.from(await r.arrayBuffer());
              const ct = r.headers.get('content-type') || 'image/png';
              return `data:${ct};base64,${buf.toString('base64')}`;
            } catch { return null; }
          }

          (async () => {
            fs.mkdirSync('api/covers', { recursive: true });

            const meta = {};
            for (const e of (data.events || [])) {
              if (!e.league || !e.league_logo) continue;
              if (!meta[e.league]) meta[e.league] = {
                logo: e.league_logo.replace(/^http:\/\//,'https://'),
                solo: SOLO_SPORTS.has(e.sport)
              };
            }

            try {
              const r = await fetch(MONIRUL_URL);
              if (r.ok) {
                const md = await r.json();
                for (const m of (md.matches || [])) {
                  const info = m.eventInfo || {};
                  const league = info.eventName || m.Category || null;
                  if (!league || meta[league]) continue;
                  const logo = info.event_logo;
                  if (!logo) continue;
                  meta[league] = {
                    logo: logo.replace(/^http:\/\//,'https://'),
                    solo: false
                  };
                }
              }
            } catch (e) { console.warn('Monirul fetch failed: ' + e.message); }

            const map = {};
            for (const [name, m] of Object.entries(meta)) {
              const embedded = await toDataUri(m.logo);
  
              let a, b;
              if (name.toLowerCase().includes("formula 1") || name.toLowerCase().includes("f1")) {
                a = "#e10600"; // F1 Red
                b = "#15151e"; // F1 Dark Carbon
              } else {
                a = randColor();
                b = randColor();
                while (b === a) b = randColor();
              }
              const bg = m.solo
                ? `<rect width="1080" height="1350" fill="${a}"/>`
                : `<rect width="540" height="1350" fill="${a}"/><rect x="540" width="540" height="1350" fill="${b}"/>`;
              const logoTag = embedded
                ? `<image href="${embedded}" x="460" y="595" width="160" height="160" preserveAspectRatio="xMidYMid meet"/>`
                : '';
              const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">${bg}<circle cx="540" cy="675" r="410" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="2"/><circle cx="540" cy="675" r="300" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="2"/><circle cx="540" cy="675" r="190" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="2"/><circle cx="540" cy="675" r="140" fill="rgba(255,255,255,.18)"/>${logoTag}</svg>`;
              const file = `api/covers/${slug(name)}.svg`;
              fs.writeFileSync(file, svg);
              map[name] = `${REPO}/${file}?v=${Date.now()}`;
            }

            for (const e of (data.events || [])) {
              if (e.league && map[e.league]) e.league_logo = map[e.league];
            }
            fs.writeFileSync('api/schedule.json', JSON.stringify(data, null, 2));
            console.log(`✅ Wrote ${Object.keys(map).length} league covers.`);
          })();
          JS

      - name: Commit
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add api/schedule.json api/covers
          git diff --staged --quiet || (
            git commit -m "auto: update greedy schedule + covers" &&
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "retry $i"; sleep 5
            done
          )
