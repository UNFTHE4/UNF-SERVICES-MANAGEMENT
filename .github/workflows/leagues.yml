name: All Sports Feed (ESPN – greedy)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

concurrency:
  group: all-sports-feed
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Fetch everything from ESPN
        run: |
          node - <<'JS'
          const fs = require('fs');
          const BASE = 'https://site.api.espn.com/apis/site/v2/sports';

          // [sport, league-slug] pairs — greedy list
          const PAIRS = [
            // ---- SOCCER (75+) ----
            ...['eng.1','esp.1','ita.1','ger.1','fra.1','ned.1','por.1','bel.1','tur.1','gre.1',
                'sco.1','rus.1','ukr.1','aut.1','sui.1','den.1','swe.1','nor.1','fin.1','pol.1',
                'cze.1','cro.1','srb.1','rom.1','hun.1','bul.1','isr.1','cyp.1','irl.1','wal.1',
                'eng.2','esp.2','ita.2','ger.2','fra.2',
                'usa.1','usa.nwsl','mex.1','bra.1','arg.1','chi.1','col.1','per.1','uru.1','ecu.1',
                'par.1','ven.1','bol.1','crc.1','hon.1','gua.1','slv.1','pan.1',
                'jpn.1','kor.1','chn.1','aus.1','ind.1','ksa.1','uae.1','qat.1','irn.1','tha.1',
                'rsa.1','egy.1','mar.1','nga.1','tun.1','alg.1',
                'uefa.champions','uefa.europa','uefa.europa.conf','uefa.super_cup',
                'conmebol.libertadores','conmebol.sudamericana',
                'concacaf.champions','concacaf.leagues.cup',
                'afc.champions','caf.champions'
              ].map(s => ['soccer', s]),

            // ---- US SPORTS ----
            ['football',   'nfl'],
            ['football',   'college-football'],
            ['basketball', 'nba'],
            ['basketball', 'wnba'],
            ['basketball', 'mens-college-basketball'],
            ['basketball', 'womens-college-basketball'],
            ['baseball',   'mlb'],
            ['baseball',   'college-baseball'],
            ['hockey',     'nhl'],
            ['mma',        'ufc'],
            ['golf',       'pga'],
            ['tennis',     'atp'],
            ['tennis',     'wta'],
            ['racing',     'f1'],
            ['racing',     'nascar-premier'],
            ['racing',     'irl'],
            ['boxing',     'all'],
            ['rugby',      'super-rugby'],
            ['lacrosse',   'pll'],
            ['volleyball', 'usa.1'],
            ['water-polo', 'usa.1'],
            ['field-hockey','usa.1'],
          ];

          async function getJSON(url) {
            const r = await fetch(url);
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
          }

          (async () => {
            const all = [];
            const failed = [];

            const CONCURRENCY = 6;
            let i = 0;
            async function worker() {
              while (i < PAIRS.length) {
                const [sport, league] = PAIRS[i++];
                try {
                  const data = await getJSON(`${BASE}/${sport}/${league}/teams`);
                  const lg = data?.sports?.[0]?.leagues?.[0];
                  const teams = lg?.teams ?? [];
                  for (const { team } of teams) {
                    all.push({
                      sport,
                      league: lg?.name ?? league,
                      league_slug: league,
                      id: Number(team.id),
                      name: team.displayName,
                      abbreviation: team.abbreviation ?? null,
                      logo: team.logos?.[0]?.href ?? null,
                    });
                  }
                  console.log(`✅ ${sport}/${league}: ${teams.length}`);
                } catch (e) {
                  failed.push({ sport, league, error: e.message });
                  console.log(`⚠️  ${sport}/${league}: ${e.message}`);
                }
              }
            }
            await Promise.all(Array.from({ length: CONCURRENCY }, worker));

            fs.mkdirSync('api', { recursive: true });
            fs.writeFileSync('api/all-sports.json', JSON.stringify({
              generated_at: new Date().toISOString(),
              pairs_count: PAIRS.length,
              teams_count: all.length,
              failed,
              teams: all,
            }, null, 2));

            const esc = s => String(s ?? '').replace(/[<>&"']/g, c =>
              ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]));
            fs.writeFileSync('api/all-sports.xml',
              '<?xml version="1.0" encoding="UTF-8"?>\n' +
              `<sports pairs="${PAIRS.length}" teams="${all.length}" generated="${new Date().toISOString()}">\n` +
              all.map(t => `  <team sport="${esc(t.sport)}" league="${esc(t.league)}" league_slug="${esc(t.league_slug)}" id="${t.id}"><name>${esc(t.name)}</name><logo>${esc(t.logo)}</logo></team>`).join('\n') +
              '\n</sports>\n');

            console.log(`🎉 ${all.length} teams from ${PAIRS.length} sport/league pairs`);
            if (failed.length) console.log(`⚠️ ${failed.length} pairs failed`);
          })();
          JS

      - name: Commit
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add api
          git diff --staged --quiet || (git commit -m "auto: refresh all-sports feed" && git push)
