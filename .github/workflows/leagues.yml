name: All Sports Feed (ESPN – greedy)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write

concurrency:
  group: all-sports-feed
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Fetch everything from ESPN
        run: |
          node - <<'JS'
          const fs = require('fs');
          const BASE = 'https://site.api.espn.com/apis/site/v2/sports';
          // [sport, league-slug] pairs — greedy list
          const PAIRS = [
            // ---- SOCCER (75+) ----
            ...['eng.1','esp.1','ita.1','ger.1','fra.1','ned.1','por.1','bel.1','tur.1','gre.1',
                'sco.1','rus.1','ukr.1','aut.1','sui.1','den.1','swe.1','nor.1','fin.1','pol.1',
                'cze.1','cro.1','srb.1','rom.1','hun.1','bul.1','isr.1','cyp.1','irl.1','wal.1',
                'eng.2','esp.2','ita.2','ger.2','fra.2',
                'usa.1','usa.nwsl','mex.1','bra.1','arg.1','chi.1','col.1','per.1','uru.1','ecu.1',
                'par.1','ven.1','bol.1','crc.1','hon.1','gua.1','slv.1','pan.1',
                'jpn.1','kor.1','chn.1','aus.1','ind.1','ksa.1','uae.1','qat.1','irn.1','tha.1',
                'rsa.1','egy.1','mar.1','nga.1','tun.1','alg.1',
                'uefa.champions','uefa.europa','uefa.europa.conf','uefa.super_cup',
                'conmebol.libertadores','conmebol.sudamericana',
                'concacaf.champions','concacaf.leagues.cup',
                'afc.champions','caf.champions'
              ].map(s => ['soccer', s]),
            // ---- US SPORTS ----
            ['football',   'nfl'],
            ['football',   'college-football'],
            ['basketball', 'nba'],
            ['basketball', 'wnba'],
            ['basketball', 'mens-college-basketball'],
            ['basketball', 'womens-college-basketball'],
            ['baseball',   'mlb'],
            ['baseball',   'college-baseball'],
            ['hockey',     'nhl'],
            ['mma',        'ufc'],
            ['golf',       'pga'],
            ['tennis',     'atp'],
            ['tennis',     'wta'],
            ['racing',     'f1'],
            ['racing',     'nascar-premier'],
            ['racing',     'irl'],
            ['boxing',     'all'],
            ['rugby',      'super-rugby'],
            ['lacrosse',   'pll'],
            ['volleyball', 'usa.1'],
            ['water-polo', 'usa.1'],
            ['field-hockey','usa.1'],
          ];
          async function getJSON(url) {
            const r = await fetch(url);
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
          }
          (async () => {
            const all = [];
            const failed = [];
            const CONCURRENCY = 6;
            let i = 0;
            async function worker() {
              while (i < PAIRS.length) {
                const [sport, league] = PAIRS[i++];
                try {
                  const data = await getJSON(`${BASE}/${sport}/${league}/teams`);
                  const lg = data?.sports?.[0]?.leagues?.[0];
                  const teams = lg?.teams ?? [];
                  for (const { team } of teams) {
                    all.push({
                      sport,
                      league: lg?.name ?? league,
                      league_slug: league,
                      id: Number(team.id),
                      name: team.displayName,
                      abbreviation: team.abbreviation ?? null,
                      logo: team.logos?.[0]?.href ?? null,
                    });
                  }
                  console.log(`✅ ${sport}/${league}: ${teams.length}`);
                } catch (e) {
                  failed.push({ sport, league, error: e.message });
                  console.log(`⚠️  ${sport}/${league}: ${e.message}`);
                }
              }
            }
            await Promise.all(Array.from({ length: CONCURRENCY }, worker));
            fs.mkdirSync('api', { recursive: true });
            fs.writeFileSync('api/all-sports.json', JSON.stringify({
              generated_at: new Date().toISOString(),
              pairs_count: PAIRS.length,
              teams_count: all.length,
              failed,
              teams: all,
            }, null, 2));
            const esc = s => String(s ?? '').replace(/[<>&"']/g, c =>
              ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]));
            fs.writeFileSync('api/all-sports.xml',
              '<?xml version="1.0" encoding="UTF-8"?>\n' +
              `<sports pairs="${PAIRS.length}" teams="${all.length}" generated="${new Date().toISOString()}">\n` +
              all.map(t => `  <team sport="${esc(t.sport)}" league="${esc(t.league)}" league_slug="${esc(t.league_slug)}" id="${t.id}"><name>${esc(t.name)}</name><logo>${esc(t.logo)}</logo></team>`).join('\n') +
              '\n</sports>\n');
            console.log(`🎉 ${all.length} teams from ${PAIRS.length} sport/league pairs`);
            if (failed.length) console.log(`⚠️ ${failed.length} pairs failed`);
          })();
          JS

      - name: Append country flags (all sports)
        run: |
          node - <<'JS'
          const fs = require('fs');
          // Country flags from lipis/flag-icons (pinned commit — immutable).
          const FLAG_BASE = 'https://raw.githubusercontent.com/lipis/flag-icons/ac7e0eb3259eb62aa6100c435607e2fe03896a97/flags/1x1/';
          // Country name -> ISO 3166-1 alpha-2 (or gb-eng / gb-sct / gb-wls / gb-nir).
          // One row per country, sport="country" — biggbang.cjs ignores sport
          // and matches by name, so these apply to ANY sport.
          const COUNTRIES = {
            'Afghanistan': 'af',
            'Albania': 'al', 'Algeria': 'dz', 'Andorra': 'ad', 'Angola': 'ao', 'Argentina': 'ar',
            'Armenia': 'am', 'Australia': 'au', 'Austria': 'at', 'Azerbaijan': 'az',
            'Bahamas': 'bs', 'Bahrain': 'bh', 'Bangladesh': 'bd', 'Barbados': 'bb', 'Belarus': 'by',
            'Belgium': 'be', 'Belize': 'bz', 'Benin': 'bj', 'Bermuda': 'bm', 'Bhutan': 'bt',
            'Bolivia': 'bo', 'Bosnia and Herzegovina': 'ba', 'Botswana': 'bw', 'Brazil': 'br',
            'Brunei': 'bn', 'Bulgaria': 'bg', 'Burkina Faso': 'bf', 'Burundi': 'bi',
            'Cambodia': 'kh', 'Cameroon': 'cm', 'Canada': 'ca', 'Cape Verde': 'cv',
            'Central African Republic': 'cf', 'Chad': 'td', 'Chile': 'cl', 'China': 'cn',
            'Colombia': 'co', 'Comoros': 'km', 'Congo': 'cg', 'DR Congo': 'cd',
            'Costa Rica': 'cr', 'Croatia': 'hr', 'Cuba': 'cu', 'Cyprus': 'cy', 'Czechia': 'cz',
            'Denmark': 'dk', 'Djibouti': 'dj', 'Dominica': 'dm', 'Dominican Republic': 'do',
            'Ecuador': 'ec', 'Egypt': 'eg', 'El Salvador': 'sv', 'Equatorial Guinea': 'gq',
            'Eritrea': 'er', 'Estonia': 'ee', 'Eswatini': 'sz', 'Ethiopia': 'et',
            'England': 'gb-eng',
            'Fiji': 'fj', 'Finland': 'fi', 'France': 'fr',
            'Gabon': 'ga', 'Gambia': 'gm', 'Georgia': 'ge', 'Germany': 'de', 'Ghana': 'gh',
            'Greece': 'gr', 'Grenada': 'gd', 'Guatemala': 'gt', 'Guinea': 'gn', 'Guinea-Bissau': 'gw',
            'Guyana': 'gy', 'Haiti': 'ht', 'Honduras': 'hn', 'Hong Kong': 'hk', 'Hungary': 'hu',
            'Iceland': 'is', 'India': 'in', 'Indonesia': 'id', 'Iran': 'ir', 'Iraq': 'iq',
            'Ireland': 'ie', 'Italy': 'it', 'Ivory Coast': 'ci',
            'Jamaica': 'jm', 'Japan': 'jp', 'Jordan': 'jo', 'Kazakhstan': 'kz', 'Kenya': 'ke',
            'Kiribati': 'ki', 'Kuwait': 'kw', 'Kyrgyzstan': 'kg',
            'Laos': 'la', 'Latvia': 'lv', 'Lebanon': 'lb', 'Lesotho': 'ls', 'Liberia': 'lr',
            'Libya': 'ly', 'Liechtenstein': 'li', 'Lithuania': 'lt', 'Luxembourg': 'lu',
            'Macau': 'mo', 'Madagascar': 'mg', 'Malawi': 'mw', 'Malaysia': 'my', 'Maldives': 'mv',
            'Mali': 'ml', 'Malta': 'mt', 'Marshall Islands': 'mh', 'Mauritania': 'mr',
            'Mauritius': 'mu', 'Mexico': 'mx', 'Micronesia': 'fm', 'Moldova': 'md', 'Monaco': 'mc',
            'Mongolia': 'mn', 'Montenegro': 'me', 'Morocco': 'ma', 'Mozambique': 'mz', 'Myanmar': 'mm',
            'Namibia': 'na', 'Nauru': 'nr', 'Nepal': 'np', 'Netherlands': 'nl', 'New Zealand': 'nz',
            'Nicaragua': 'ni', 'Niger': 'ne', 'Nigeria': 'ng', 'North Korea': 'kp',
            'North Macedonia': 'mk', 'Norway': 'no',
            'Oman': 'om', 'Pakistan': 'pk', 'Palau': 'pw', 'Palestine': 'ps', 'Panama': 'pa',
            'Papua New Guinea': 'pg', 'Paraguay': 'py', 'Peru': 'pe', 'Philippines': 'ph',
            'Poland': 'pl', 'Portugal': 'pt',
            'Qatar': 'qa', 'Romania': 'ro', 'Russia': 'ru', 'Rwanda': 'rw',
            'Saint Kitts and Nevis': 'kn', 'Saint Lucia': 'lc',
            'Saint Vincent and the Grenadines': 'vc', 'Samoa': 'ws', 'San Marino': 'sm',
            'Saudi Arabia': 'sa', 'Scotland': 'gb-sct', 'Senegal': 'sn', 'Serbia': 'rs',
            'Seychelles': 'sc', 'Sierra Leone': 'sl', 'Singapore': 'sg', 'Slovakia': 'sk',
            'Slovenia': 'si', 'Solomon Islands': 'sb', 'Somalia': 'so', 'South Africa': 'za',
            'South Korea': 'kr', 'South Sudan': 'ss', 'Spain': 'es', 'Sri Lanka': 'lk',
            'Sudan': 'sd', 'Suriname': 'sr', 'Sweden': 'se', 'Switzerland': 'ch', 'Syria': 'sy',
            'Taiwan': 'tw', 'Tajikistan': 'tj', 'Tanzania': 'tz', 'Thailand': 'th',
            'Timor-Leste': 'tl', 'Togo': 'tg', 'Tonga': 'to', 'Trinidad and Tobago': 'tt',
            'Tunisia': 'tn', 'Turkey': 'tr', 'Turkmenistan': 'tm', 'Tuvalu': 'tv',
            'Uganda': 'ug', 'Ukraine': 'ua', 'United Arab Emirates': 'ae', 'United Kingdom': 'gb',
            'United States': 'us', 'Uruguay': 'uy', 'Uzbekistan': 'uz',
            'Vanuatu': 'vu', 'Vatican City': 'va', 'Venezuela': 've', 'Vietnam': 'vn',
            'Wales': 'gb-wls',
            'Yemen': 'ye', 'Zambia': 'zm', 'Zimbabwe': 'zw'
          };
          // West Indies is a composite team — no ISO code. Self-hosted.
          const WEST_INDIES = 'https://raw.githubusercontent.com/UNFTHE4/UNF-SERVICES-MANAGEMENT/refs/heads/main/assets/CRICKET/West%20Indies.jpg';

          const esc = s => String(s ?? '').replace(/[<>&"']/g, c =>
            ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]));
          const file = 'api/all-sports.xml';
          let xml = fs.readFileSync(file, 'utf8');
          // Idempotent: remove existing country rows first
          xml = xml.replace(/^.*<team sport="country"[\s\S]*?<\/team>\n?/gm, '');
          let i = 0;
          const rows = [];
          for (const [name, code] of Object.entries(COUNTRIES)) {
            i++;
            const logo = FLAG_BASE + code + '.svg';
            rows.push(`  <team sport="country" league="Countries" league_slug="countries" id="ctry-${i}"><name>${esc(name)}</name><logo>${esc(logo)}</logo></team>`);
          }
          i++;
          rows.push(`  <team sport="country" league="Countries" league_slug="countries" id="ctry-${i}"><name>West Indies</name><logo>${esc(WEST_INDIES)}</logo></team>`);
          xml = xml.replace('</sports>', rows.join('\n') + '\n</sports>');
          fs.writeFileSync(file, xml);
          console.log(`Re-wrote ${rows.length} country rows (${Object.keys(COUNTRIES).length} from lipis + West Indies) in ${file}`);
          JS

      - name: Blacklist (remove teams / logo URLs)
        run: |
          node - <<'JS'
          const fs = require('fs');

          // ============================================================
          // BLACKLIST — remove matching <team> rows from api/all-sports.xml
          // so biggbang.cjs never indexes them. Works for ANY sport.
          //
          // NAMES : matched against <name> after the same normalize() as
          //         biggbang.cjs. Substring. 'Pakistan' hides Pakistan +
          //         Pakistan U19 + Pakistan Women.
          // LOGOS : exact URL match against <logo>.
          //
          // Empty array = no-op.
          // ============================================================
          const BLACKLIST_NAMES = [
            'Israel',
          ];
          const BLACKLIST_LOGOS = [
          ];

          // Same normalize used in biggbang.cjs — keep in sync if you change it there.
          function normalize(s) {
            return String(s || '')
              .toLowerCase()
              .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
              .replace(/\b(fc|afc|cf|sc|cd|ca|ac|as|us|sv|vfb|vfl|fsv|tsg|sd|ud|rcd|rc|club|deportivo|stade|de|of|the|united|city|town)\b/g, ' ')
              .replace(/\b(u[\s-]?\d{1,2}|under[\s-]?\d{1,2}|women|womens|men|mens|emerging|academy|reserves?)\b/g, ' ')
              .replace(/\s+a(?:\s+|$)/g, ' ')
              .replace(/[^a-z0-9]/g, '');
          }

          const nkNames = BLACKLIST_NAMES.map(normalize).filter(Boolean);
          const lkLogos = BLACKLIST_LOGOS.map(s => String(s).toLowerCase());

          const file = 'api/all-sports.xml';
          let xml = fs.readFileSync(file, 'utf8');
          const before = (xml.match(/<team\s/g) || []).length;

          const removeTeam = (block) => {
            const nameM = block.match(/<name>([\s\S]*?)<\/name>/);
            const logoM = block.match(/<logo>([\s\S]*?)<\/logo>/);
            const name = nameM ? nameM[1].replace(/&amp;/g, '&').replace(/&apos;/g, "'") : '';
            const logo = logoM ? logoM[1].trim() : '';
            const n = normalize(name);
            if (n && nkNames.some(k => n.includes(k))) return true;
            if (logo && lkLogos.includes(logo.toLowerCase())) return true;
            return false;
          };

          xml = xml.replace(/^.*<team\s[^>]*>[\s\S]*?<\/team>\n?/gm, (block) => {
            return removeTeam(block) ? '' : block;
          });

          fs.writeFileSync(file, xml);
          const after = (xml.match(/<team\s/g) || []).length;
          console.log(`Blacklist: removed ${before - after} of ${before} team rows (${BLACKLIST_NAMES.length} name rules, ${BLACKLIST_LOGOS.length} logo rules)`);
          JS

      - name: Commit
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add api
          git diff --staged --quiet || (git commit -m "auto: refresh all-sports feed" && git push)
