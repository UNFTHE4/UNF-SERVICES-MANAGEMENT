name: Build EPG JSON

on:
  push:
    paths: ['epg.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install yaml
        run: npm install --no-save --no-package-lock yaml

      - name: Convert YAML to JSON
        run: |
          mkdir -p api
          node -e '
            const yaml = require("yaml");
            const fs = require("fs");
            const data = yaml.parse(fs.readFileSync("epg.yml","utf8"));
            const out = {
              generated: new Date().toISOString(),
              matches: (data.matches || []).map(m => ({
                sport: m.sport,
                league: m.league,
                home: m.home,
                away: m.away,
                title: m.title || ((m.home || "") + " vs " + (m.away || "")),
                start: m.start,
                end: m.end,
                channels: (m.channels || []).map(id => {
                  const c = (data.channels || {})[id] || {};
                  return { id: id, name: c.name || id, logo: c.logo || null };
                })
              }))
            };
            fs.writeFileSync("api/epg.json", JSON.stringify(out, null, 2));
            console.log("OK - wrote api/epg.json - " + out.matches.length + " matches");
          '

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/epg.json
          git diff --staged --quiet || git commit -m "chore: rebuild epg.json"
          git push
