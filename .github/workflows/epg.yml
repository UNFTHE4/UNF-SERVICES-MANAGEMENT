name: Build EPG JSON

on:
  push:
    paths: ['epg.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build api/epg.json from epg.yml
        run: |
          mkdir -p api
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("epg.yml", "utf8");

            // Tiny YAML subset parser (matches/channels only, no deps)
            const lines = raw.split(/\r?\n/);
            const out = { matches: [], channels: {} };
            let section = null, cur = null, key = null;

            function val(v) {
              v = v.trim().replace(/^["\x27]|["\x27]$/g, "");
              if (v.startsWith("[") && v.endsWith("]")) {
                return v.slice(1, -1).split(",").map(s => s.trim().replace(/^["\x27]|["\x27]$/g,"")).filter(Boolean);
              }
              return v;
            }

            for (const line of lines) {
              if (!line.trim() || line.trim().startsWith("#")) continue;
              const ind = line.length - line.trimStart().length;
              const t = line.trim();

              if (ind === 0) {
                if (t === "matches:") { section = "matches"; cur = null; }
                else if (t === "channels:") { section = "channels"; cur = null; }
                else section = null;
                continue;
              }

              if (section === "matches") {
                if (t.startsWith("- ")) {
                  cur = {}; out.matches.push(cur);
                  const kv = t.slice(2).split(/:\s*/);
                  if (kv[1] !== undefined) cur[kv[0]] = val(kv[1]);
                } else if (cur) {
                  const m = t.match(/^([\w-]+):\s*(.*)$/);
                  if (m) cur[m[1]] = val(m[2]);
                }
              } else if (section === "channels") {
                const chm = t.match(/^["\x27]?([\w-]+)["\x27]?:\s*$/);
                if (ind === 2 && chm) {
                  key = chm[1]; out.channels[key] = {}; cur = out.channels[key];
                } else if (cur) {
                  const m = t.match(/^([\w-]+):\s*(.*)$/);
                  if (m) cur[m[1]] = val(m[2]);
                }
              }
            }

            // Expand channel IDs into objects inside each match
            out.matches.forEach(m => {
              const ids = Array.isArray(m.channels) ? m.channels
                        : m.channels ? [m.channels] : [];
              m.channels = ids.map(id => {
                const c = out.channels[id] || {};
                return { id, name: c.name || id, logo: c.logo || null };
              });
              if (!m.title && (m.home || m.away)) m.title = m.home + " vs " + m.away;
            });

            out.generated = new Date().toISOString();
            out.count = out.matches.length;

            fs.writeFileSync("api/epg.json", JSON.stringify(out, null, 2));
            console.log("OK — wrote api/epg.json with " + out.count + " matches");
          '

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/epg.json
          git diff --staged --quiet || git commit -m "chore: rebuild epg.json"
          git push
