name: Build EPG JSON

on:
  push:
    paths: ['epg.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert YAML to JSON
        run: |
          mkdir -p api
          yq -o=json epg.yml > api/epg.json

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/epg.json
          git diff --staged --quiet || git commit -m "chore: rebuild epg.json"
          git push
