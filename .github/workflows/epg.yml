name: Build EPG

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    paths:
      - 'api/schedule.json'
      - 'assets/tv/channels.json'
      - 'matcher.js'
      - '.github/workflows/epg.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Build epg.json
        run: node matcher.js

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/epg.json
          git diff --staged --quiet || git commit -m "chore: rebuild epg"
          git push
