name: Generate Event Posters

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch:      # Allows manual trigger from Actions tab
  push:
    paths:
      - 'events.json'     # Runs whenever you update the feed

permissions:
  contents: write         # Needed to commit the generated files

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate posters
        run: node build-posters.js

      - name: Commit & push new posters
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add posters/ events.json
          
          # Commit only if there are actually new changes
          if git diff --cached --quiet; then
            echo "No changes, skipping commit."
          else
            git commit -m "chore: regenerate posters [skip ci]"
            git push
          fi
