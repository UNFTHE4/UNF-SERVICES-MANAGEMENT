<!DOCTYPE html><html><body style="margin:0;background:#000"><select id="lg" style="position:fixed;top:10px;left:10px;z-index:9;max-width:320px"></select><button id="regen" style="position:fixed;top:10px;left:340px;z-index:9">New colors</button><div style="width:1080px;height:1350px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;"><div id="left" style="position:absolute;top:0;left:0;width:50%;height:100%"></div><div id="right" style="position:absolute;top:0;right:0;width:50%;height:100%"></div><div id="single" style="position:absolute;inset:0;display:none"></div><div style="position:absolute;width:820px;height:820px;border:1px solid rgba(255,255,255,.07);border-radius:50%"></div><div style="position:absolute;width:600px;height:600px;border:1px solid rgba(255,255,255,.10);border-radius:50%"></div><div style="position:absolute;width:380px;height:380px;border:1px solid rgba(255,255,255,.14);border-radius:50%"></div><div style="position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.25) 0%,rgba(255,255,255,0) 70%);filter:blur(8px)"></div><img id="logo" style="max-height:160px;max-width:160px;width:auto;height:auto;position:relative;z-index:2;filter:drop-shadow(0 6px 30px rgba(0,0,0,.7));"></div><script>const DATA = {"leagues":{"National Football League":"https://a.espncdn.com/i/teamlogos/leagues/500/nfl.png","Spanish LALIGA 2":"https://a.espncdn.com/i/leaguelogos/soccer/500/107.png","NCAA Women's Basketball":"https://a.espncdn.com/redesign/assets/img/icons/NCAASports_WomensBasketball.png","NCAA - Football":"https://a.espncdn.com/redesign/assets/img/icons/NCAASports_Football.png","National Basketball Association":"https://a.espncdn.com/i/teamlogos/leagues/500/nba.png","NCAA Men's Basketball":"https://a.espncdn.com/redesign/assets/img/icons/NCAASports_MensBasketball.png","Peruvian Liga 1":"https://a.espncdn.com/i/leaguelogos/soccer/500/1813.png","Liga AUF Uruguaya":"https://a d("right"),S=document.getElementById("single");if(split){L1.style.display="block";R1.style.display="block";S.style.display="none";const a=randColor();let b=randColor();while(b===a)b=randColor();L1.style.background=a;R1.style.background=b;}else{L1.style.display="none";R1.style.display="none";S.style.display="block";S.style.background=randColor();}}const sel=document.getElementById("lg");for(const k of Object.keys(L).sort()){const o=document.createElement("option");o.value=k;o.textContent=k;sel.appendChild(o);}function apply(){const n=sel.value;if(L[n])document.getElementById("logo").src=L[n];paint(n);}sel.onchange=apply;document.getElementById("regen").onclick=function(){paint(sel.value);};if(Object.keys(L).length)apply();</script></body></html>
